name: Actualizar datos y publicar

permissions:
  contents: write

on:
  schedule:
    - cron: "0 5 * * *"      # datos de madrugada
    - cron: "30 17 * * *"     # repaso tras las carreras del domingo
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jinja2 pillow

      - name: Descargar datos y compilar
        run: python build.py --fetch

      - name: Comprobar que se han generado las páginas
        run: |
          test -f public/index.html
          test -f public/escuderias/index.html
          test -f public/pilotos/index.html
          echo "páginas: $(find public -name '*.html' | wc -l)"
          echo "fotos:   $(ls public/assets/drivers | wc -l)"

      - name: Vincular al proyecto existente
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest link --yes --project pitlane --token "$VERCEL_TOKEN"

      - name: Publicar en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      # El despliegue ya ha ocurrido: guardar los datos en el repo es un extra,
      # así que nunca debe tumbar la ejecución (rebasa si hay cambios nuevos).
      - name: Confirmar cambios en el repositorio
        continue-on-error: true
        run: |
          git config user.name  "pitlane-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/site.json
          git diff --cached --quiet || git commit -m "datos: actualización automática $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin master || true
          git push || echo "push omitido: hay cambios locales en master"
